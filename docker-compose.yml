services:
  workspace:
    build: .
    container_name: bigdata_workspace
    platform: linux/amd64
    ports:
      - "8888:8888"
      - "4040:4040"
      - "5900:5900"
      - "6080:6080"
    volumes:
      - .:/home/jovyan/work
      - /etc/resolv.conf:/etc/resolv.conf    
    environment:
      - JUPYTER_TOKEN=
      - JUPYTER_PASSWORD=
      - JUPYTER_ALLOW_INSECURE_WRITES=true
      - DISPLAY=:99
      - JUPYTER_ENABLE_LAB=yes
    shm_size: "2gb"
    depends_on:
      - database
      - admin-db
      - admin-db-atlas
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
    networks:
      - BigData_Network_UCN

  database:
    image: mongo:latest
    container_name: bigdata_mongodb
    platform: linux/amd64
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - BigData_Network_UCN

  admin-db:
    image: mongo-express:latest
    container_name: bigdata_ui_local
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://database:27017/
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      - database
    networks:
      - BigData_Network_UCN

  admin-db-atlas:
    image: mongo-express:latest
    container_name: bigdata_ui_atlas
    restart: always
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://nicolegarcia_db_user:Ternurines123@ac-iq19sqr-shard-00-00.uia9vsi.mongodb.net:27017,ac-iq19sqr-shard-00-01.uia9vsi.mongodb.net:27017,ac-iq19sqr-shard-00-02.uia9vsi.mongodb.net:27017/BigData_UCN?ssl=true&replicaSet=atlas-t7etb5-shard-0&authSource=admin&retryWrites=true&w=majority
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    volumes:
      - /etc/resolv.conf:/etc/resolv.conf   
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - BigData_Network_UCN

  filebrowser:
    image: filebrowser/filebrowser
    container_name: bigdata_filebrowser
    restart: always
    ports:
      - "8083:80"
    volumes:
      - .:/srv
    networks:
      - BigData_Network_UCN

volumes:
  mongo_data:

networks:
  BigData_Network_UCN:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16



